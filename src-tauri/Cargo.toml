[package]
name = "mdex"
version = "2.3.0"
description = "macOS 离线 Markdown 阅读编辑器"
authors = ["郑法伟 (Fawei Zheng) <fwzheng@bit.edu.cn>"]
license = "Apache-2.0"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "mdex_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] } # TEMP: Windows AI 窗卡死诊断,open_devtools 需此 feature;定位后改回 []
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "macros"] }
base64 = "0.22"
# 非 UTF-8 文件（GBK/Latin-1/UTF-16 等）的兜底解码，避免旧文件打不开（D6）。
encoding_rs = "0.8"
# AI 改写：流式调用 OpenAI 兼容接口。用 rustls-tls（不依赖系统 OpenSSL，跨平台构建干净）；
# default-features=false 关闭默认 native-tls 与 http2（改写仅需 HTTP/1，reqwest 中 HTTP/1 无条件内置）。
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
# 流式响应逐块读取（StreamExt::next）。
futures-util = "0.3"

[dev-dependencies]
# 仅测试用：临时目录。
tempfile = "3"

# 仅 Windows/Linux：拦截“应用已运行时再双击文件”的第二个进程，把 argv 转给现有实例。
# macOS 天然单实例（走 Apple Event），不需要此插件。
[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
opt-level = "s"
