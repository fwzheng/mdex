# MDeX CI —— 在此前无任何 CI(审查报告优先级 2)。
# 三 job:web 护栏(快,无 Rust) / Rust 跨平台单元测试 / 端到端对齐(需 Chrome,仅 macOS)。
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  # ---- web 护栏:build:html 自检(语法 + 无外链泄漏)+ 前端纯函数回归 ----
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: lts/*, cache: npm }
      - run: npm ci
      - name: 构建前端 dist(build-html.mjs 内置“无外链”自检 + app.js 语法校验)
        run: npm run build:html
      - name: 前端纯函数回归(20 断言,失败非零退出)
        run: npm test

  # ---- Rust 单元测试:跨平台(macOS + Linux) ----
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: lts/*, cache: npm }
      - run: npm ci
      - name: 安装 Tauri Linux 系统依赖(webkit2gtk 等,仅 ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - name: cargo test(21 单元测试,含 S1 路径校验/detect_image_mime 等)
        working-directory: src-tauri
        run: cargo test --all

  # ---- 端到端对齐:预览块偏移 + 滚动同步(需真实 Chrome,macOS runner 自带) ----
  e2e:
    runs-on: macos-latest
    needs: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: lts/*, cache: npm }
      - run: npm ci
      - run: npm run build:html
      - name: 对齐 e2e(GitHub macOS runner 预装 Google Chrome 于默认路径)
        run: node tools/test-align-e2e.mjs
